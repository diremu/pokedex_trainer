<section class="trainer-profile-page">
  <div class="profile-header">
    <div class="profile-cover"></div>
    <div class="profile-content">
      <img src="assets/pokeball.webp" alt="Trainer Avatar" class="profile-avatar">
      <div class="profile-info">
        <h1>Ash Ketchum</h1>
        <p class="trainer-title">Gym Leader</p>
        <p class="trainer-bio">Gotta catch 'em all!</p>
      </div>
    </div>
  </div>

  <div class="profile-tabs">
    <div class="tab active">
      <h2>Achievements</h2>
      <div class="achievement-grid">
        <div class="achievement-badge">
          <span class="badge-icon">🥇</span>
          <p>First Victory</p>
        </div>
        <div class="achievement-badge">
          <span class="badge-icon">🏆</span>
          <p>Champion</p>
        </div>
        <div class="achievement-badge">
          <span class="badge-icon">🎯</span>
          <p>Collector</p>
        </div>
        <div class="achievement-badge">
          <span class="badge-icon">⚡</span>
          <p>Type Master</p>
        </div>
      </div>
    </div>

    <div class="tab">
      <h2>Statistics</h2>
      <div class="stats-overview">
        <div class="stat-row">
          <span>Pokémon Caught</span>
          <span class="stat-number">450</span>
        </div>
        <div class="stat-row">
          <span>Battles Completed</span>
          <span class="stat-number">100</span>
        </div>
        <div class="stat-row">
          <span>Teams Created</span>
          <span class="stat-number">8</span>
        </div>
        <div class="stat-row">
          <span>Experience Points</span>
          <span class="stat-number">15,240</span>
        </div>
      </div>
    </div>

    <div class="tab">
      <h2>Favorite Pokémon</h2>
      <div class="favorites-grid">
        <div class="favorite-pokemon">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu">
          <p>Pikachu</p>
        </div>
        <div class="favorite-pokemon">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png" alt="Charizard">
          <p>Charizard</p>
        </div>
        <div class="favorite-pokemon">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/9.png" alt="Blastoise">
          <p>Blastoise</p>
        </div>
      </div>
    </div>
  </div>
</section>
