<section class="team-builder-page">
  <div class="page-header">
    <h1>Team Builder</h1>
    <p>Create and manage your Pokémon teams</p>
  </div>

  <div class="team-container">
    <div class="team-panel">
      <h2>My Teams</h2>
      <div class="team-list">
        <div class="team-item">
          <h3>Fire Team</h3>
          <p>6 Pokémon selected</p>
          <button class="btn btn-sm">Edit</button>
        </div>
        <div class="team-item">
          <h3>Water Team</h3>
          <p>4 Pokémon selected</p>
          <button class="btn btn-sm">Edit</button>
        </div>
        <button class="btn btn-primary">Create New Team</button>
      </div>
    </div>

    <div class="team-editor">
      <h2>Team Roster</h2>
      <div class="roster-slots">
        <div class="roster-slot empty">
          <span>Slot 1</span>
          <button class="btn btn-sm">Add Pokémon</button>
        </div>
        <div class="roster-slot empty">
          <span>Slot 2</span>
          <button class="btn btn-sm">Add Pokémon</button>
        </div>
        <div class="roster-slot empty">
          <span>Slot 3</span>
          <button class="btn btn-sm">Add Pokémon</button>
        </div>
        <div class="roster-slot empty">
          <span>Slot 4</span>
          <button class="btn btn-sm">Add Pokémon</button>
        </div>
        <div class="roster-slot empty">
          <span>Slot 5</span>
          <button class="btn btn-sm">Add Pokémon</button>
        </div>
        <div class="roster-slot empty">
          <span>Slot 6</span>
          <button class="btn btn-sm">Add Pokémon</button>
        </div>
      </div>
    </div>
  </div>
</section>
